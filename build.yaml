---
include:
  # Nordic nRF52840 Dongle - CENTRAL
  - board: nrf52840dongle_nrf52840
    shield: athena_dongle
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2 -DCONFIG_BT_MAX_CONN=7 -DCONFIG_BT_MAX_PAIRED=7
    artifact-name: athena_dongle

  # Corne LEFT - PERIPHERAL
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: athena_left

  # Corne RIGHT - PERIPHERAL
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: athena_right

  # Reset firmware for both nice!nanos
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_nano_settings_reset

  # Reset firmware for Nordic dongle
  - board: nrf52840dongle_nrf52840
    shield: settings_reset
    artifact-name: dongle_settings_reset
